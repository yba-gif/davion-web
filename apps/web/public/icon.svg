<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Brand-green rounded square (rx=22, ~iOS app-icon corner radius). -->
  <rect width="100" height="100" rx="22" fill="#60E576"/>

  <!-- The "D" mark. Outer letterform + inner counter, fill-rule=evenodd
       carves the counter so the green shows through. -->
  <path
    d="M14 12 L46 12 A35 35 0 0 1 46 82 L14 82 Z
       M26 24 L46 24 A23 23 0 0 1 46 70 L26 70 Z"
    fill="white"
    fill-rule="evenodd"/>

  <!-- The period after "D". Sits to the right of the D's bowl, on baseline. -->
  <circle cx="86" cy="80" r="6" fill="white"/>
</svg>
