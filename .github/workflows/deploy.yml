name: Deploy

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
                uses: actions/checkout@v4

            - name: Trigger deployment
                run: |
                    curl -X POST http://34.40.28.88:3000/api/compose/deploy/5fda36fa0fcf06125e0dd2bedf91c2d84af5cd5a5f7d7e1b \
                      -H "Content-Type: application/json" \
                      -H "User-Agent: GitHub-Actions" \
                      --fail-with-body \
                      --max-time 300

            - name: Deployment status
                run: echo "Deployment triggered successfully"
